{% extends 'base.html' %}{% block heading %}Achievement card appearance{% endblock %}{% block subheading %}Choose how unlock-card artwork looks when members earn achievements. This does not change achievement rules.{% endblock %}{% block content %}<form method="post" class="editor"><div class="form-group"><label>Community name</label><input name="name" maxlength="30" required value="{{ brand.name }}"></div><div class="form-group"><label>Tagline</label><input name="tagline" maxlength="30" value="{{ brand.tagline }}"></div><div class="form-group"><label>Accent color</label><input name="accent" type="color" value="{{ brand.accent or '#e3bc77' }}"></div><div class="form-group"><label>Card background</label><select name="theme"><option value="crest" {% if brand.theme=='crest' %}selected{% endif %}>Fantasy crest</option><option value="minimal" {% if brand.theme=='minimal' %}selected{% endif %}>Clean dark</option></select></div><button class="btn">Save style</button> <a href="{{ url_for('cards_page') }}">Preview cards</a></form>{% endblock %}
