<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#140c09"><title>CritBot — Guild Login</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 6%,#702b1b77,transparent 52%),linear-gradient(135deg,#110c0a,#21120d);color:#f3e5d5;font-family:Inter,'Segoe UI',system-ui,sans-serif;padding:20px}.login{width:min(460px,100%);padding:44px 36px;background:linear-gradient(150deg,#2a1b15,#18110e);border:1px solid #825033;border-radius:18px;box-shadow:0 30px 85px #0008;text-align:center;position:relative}.login:before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,#952d1d,#ec8732,#efc27c,#952d1d);border-radius:18px 18px 0 0}.logo{width:90px;height:90px;object-fit:contain;filter:drop-shadow(0 0 18px #bd5f2933)}.overline{font-size:11px;color:#d29b61;letter-spacing:3px;font-weight:800;margin:14px 0 6px}.login h1{font-size:36px;letter-spacing:1px;color:#f6dcaf;margin:0}.sub{font-size:14px;color:#c7a997;margin:7px 0 27px}.login a{display:block;border:1px solid #f0c47a;padding:14px 18px;color:#25160e;background:linear-gradient(120deg,#f2c47c,#d98235);text-decoration:none;font-weight:850;border-radius:9px}.login a:hover{filter:brightness(1.1)}.foot{font-size:12px;color:#a98e7e;margin-top:22px;line-height:1.6}.error{color:#ffb3a5;background:#43221e;padding:11px;border:1px solid #a04b3e;border-radius:8px;font-size:12px;margin:0 0 18px}
</style></head><body><main class="login"><img class="logo" src="{{ url_for('static',filename='ftc-mark.png') }}" alt="Flick the Crit emblem"><div class="overline">FLICK THE CRIT</div><h1>CRITBOT</h1><p class="sub">Guild Dashboard · Member Profiles · Officer Tools</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form action="{{url_for('oauth_start')}}" method="get"><label style="display:flex;gap:10px;align-items:center;justify-content:center;margin-bottom:18px;font-size:14px"><input type="checkbox" name="remember" value="1"> Remember me on this browser for 30 days</label><button type="submit" style="width:100%;background:#e9b86b;border:0;border-radius:8px;padding:14px;font-weight:800;cursor:pointer">Sign in with Discord →</button></form><p class="foot">Flick the Crit members can edit their own profiles. Officer tools remain permission-restricted.</p></main></body></html>
