<dialog id="suggestion-review" class="picker-dialog"><div style="padding:24px"><h2>Confirm action</h2><p id="suggestion-review-text"></p><div class="picker-footer"><button type="button" class="picker-secondary" id="suggestion-review-cancel">Back</button><button type="button" class="btn" id="suggestion-review-accept">Confirm</button></div></div></dialog>
<script>(()=>{const dialog=document.getElementById('suggestion-review');let selected=null;for(const form of document.querySelectorAll('[data-review]'))form.addEventListener('submit',e=>{e.preventDefault();selected=form;document.getElementById('suggestion-review-text').textContent=form.dataset.review;dialog.showModal();});document.getElementById('suggestion-review-cancel').onclick=()=>dialog.close();document.getElementById('suggestion-review-accept').onclick=()=>{if(selected){document.getElementById('suggestion-review-accept').disabled=true;selected.submit();}};})();</script>
