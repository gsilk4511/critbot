services:
  critbot:
    image: ghcr.io/gsilk4511/critbot:latest
    container_name: critbot
    restart: unless-stopped
    env_file:
      - ${CRITBOT_ENV_FILE:-.env}
    volumes:
      - type: bind
        source: ${CRITBOT_DATA_DIR:?Set CRITBOT_DATA_DIR to the existing absolute CritBot data directory}
        target: /app/data
        bind:
          create_host_path: false
    # Nginx Proxy Manager forwards to http://critbot:5000 on this network.
    networks:
      - dashboard

networks:
  dashboard:
    external: true
    name: ${CRITBOT_DOCKER_NETWORK:-eth0}
