services:
  critbot:
    build: .
    container_name: critbot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    ports:
      - "5000:5000"
 # No inbound ports: Discord uses outbound connections;
    # the built-in Cloudflare Tunnel reaches dashboard on 127.0.0.1:5000.
